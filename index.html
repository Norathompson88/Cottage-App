<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Cottage</title>
<style>
  :root {
    --bg: #e8dcc8;
    --card: #fffaf2;
    --ink: #4a3f35;
    --accent: #7a9e7e;
    --accent-dark: #5c7d60;
    --coin: #d4a017;
    --water: #6fa8c4;
    --food: #c47a4f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--ink);
  }

  .app-scene { position: fixed; inset: 0; overflow: hidden; background: #d8cba8; }
  .scene-room { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .scene-lighting { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: multiply; transition: background-color 1.2s ease, opacity 1.2s ease; z-index: 2; }
  .scene-item, .scene-dog {
    position: absolute;
    pointer-events: none;
    transition: left 1.1s ease-in-out, top 1.1s ease-in-out, opacity 0.25s ease;
  }
  .scene-item.draggable { pointer-events: auto; touch-action: none; cursor: grab; }
  .scene-item.dragging {
    transition: none !important;
    filter: drop-shadow(0 8px 12px rgba(0,0,0,0.35));
    z-index: 10;
    cursor: grabbing;
  }
  .scene-dog { z-index: 3; }

  .hud-coins {
    position: fixed;
    top: calc(env(safe-area-inset-top, 12px) + 10px);
    left: 50%;
    transform: translateX(-50%);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,250,240,0.88);
    backdrop-filter: blur(4px);
    border-radius: 20px;
    padding: 7px 16px;
    font-weight: 600;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    z-index: 6;
  }
  .hud-coins .dot { color: var(--coin); font-size: 1.1rem; }

  .hud-status {
    position: fixed;
    left: 12px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
    background: rgba(255,250,240,0.85);
    backdrop-filter: blur(4px);
    border-radius: 14px;
    padding: 8px 12px;
    font-size: 0.78rem;
    max-width: 62%;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    z-index: 6;
  }
  .hud-status .row { display: flex; gap: 10px; margin-bottom: 3px; }
  .hud-status .row span { opacity: 0.6; }
  .hud-status .row span.active { opacity: 1; font-weight: 600; }
  .hud-status .msg { opacity: 0.7; }

  .fab-bar {
    position: fixed;
    right: 14px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 6;
  }
  .fab-btn {
    width: 66px; height: 66px;
    border-radius: 50%;
    border: none;
    background: rgba(255,250,240,0.92);
    backdrop-filter: blur(4px);
    font-size: 1.7rem;
    box-shadow: 0 3px 10px rgba(0,0,0,0.2);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    padding: 0;
  }
  .fab-btn.fab-icon {
    background-image: url('icon-tasks.png');
    background-size: 66%;
    background-repeat: no-repeat;
    background-position: center;
  }
  .fab-btn.fab-icon-shop {
    background-image: url('icon-shop.png');
    background-size: 88%;
    background-repeat: no-repeat;
    background-position: center;
  }

  .panel-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.22);
    display: none;
    z-index: 8;
  }
  .panel-overlay.open { display: block; }
  .panel {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    max-height: 78vh;
    background: rgba(255,250,240,0.5);
    backdrop-filter: blur(3px);
    border-radius: 22px 22px 0 0;
    padding: 16px 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
    overflow-y: auto;
    transform: translateY(105%);
    transition: transform 0.3s ease;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.2);
    z-index: 9;
  }
  .panel.open { transform: translateY(0); }
  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .panel-header h2 { margin: 0; font-size: 1.15rem; }
  .panel-close {
    border: none; background: rgba(0,0,0,0.06);
    width: 30px; height: 30px; border-radius: 50%;
    font-size: 0.95rem;
  }
  .panel h3 {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    opacity: 0.6;
    margin: 18px 0 8px 2px;
  }
  .panel h3:first-of-type { margin-top: 0; }

  .shop-item {
    background: var(--card);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .shop-item .thumb { width: 46px; height: 46px; object-fit: contain; flex-shrink: 0; }
  .shop-item .info { flex: 1; }
  .shop-item .info .name { font-size: 0.95rem; }
  .shop-item .info .cost { font-size: 0.8rem; opacity: 0.55; }
  .shop-item button {
    border: none;
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.85rem;
    font-weight: 600;
    background: var(--accent-dark);
    color: white;
  }
  .shop-item button:disabled {
    background: #ddd;
    color: #999;
  }

  section { margin-top: 22px; }
  section h2 {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    opacity: 0.6;
    margin: 0 0 8px 4px;
  }

  .task {
    background: rgba(255,250,240,0.55);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .task-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .checkbox {
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.9rem;
  }
  .checkbox.done { background: var(--accent); color: white; }
  .task-name { flex: 1; font-size: 1rem; }
  .task-name.done { text-decoration: line-through; opacity: 0.5; }
  .task-reward { font-size: 0.8rem; opacity: 0.55; }
  .task-stats { font-size: 0.75rem; opacity: 0.6; margin-top: 8px; }

  .progress-wrap { margin-top: 10px; }
  .progress-bar-bg {
    background: #eee2cf;
    border-radius: 8px;
    height: 10px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    border-radius: 8px;
    transition: width 0.3s ease;
  }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    opacity: 0.7;
    margin-top: 4px;
  }
  .quick-add {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .quick-add button {
    border: none;
    background: var(--accent);
    color: white;
    padding: 6px 12px;
    border-radius: 10px;
    font-size: 0.85rem;
  }
  .quick-add input {
    width: 60px;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 0.85rem;
  }
  .quick-add .custom-add { display: flex; gap: 4px; align-items: center; }

  .manage-toggle {
    text-align: center;
    margin-top: 24px;
    font-size: 0.85rem;
    opacity: 0.6;
    text-decoration: underline;
  }
  .manage {
    display: none;
    margin-top: 12px;
  }
  .manage.open { display: block; }
  .manage-item {
    background: rgba(255,250,240,0.55);
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
  }
  .manage-item input[type=text] { flex: 1; border: 1px solid #ddd; border-radius: 6px; padding: 4px 6px; }
  .manage-item input[type=number] { width: 55px; border: 1px solid #ddd; border-radius: 6px; padding: 4px 6px; }
  .manage-item button.del { border: none; background: #d9776e; color: white; border-radius: 6px; padding: 4px 8px; }
  .add-task-form {
    background: rgba(255,250,240,0.55);
    border-radius: 12px;
    padding: 12px;
    margin-top: 10px;
    font-size: 0.85rem;
  }
  .add-task-form input, .add-task-form select {
    width: 100%;
    margin-top: 6px;
    padding: 6px 8px;
    border: 1px solid #ddd;
    border-radius: 6px;
  }
  .add-task-form button {
    margin-top: 10px;
    width: 100%;
    border: none;
    background: var(--accent-dark);
    color: white;
    padding: 10px;
    border-radius: 8px;
    font-weight: 600;
  }
</style>
</head>
<body>
<div class="app-scene" id="scene">
  <img class="scene-room" src="room.png" alt="cottage">
  <div class="scene-lighting" id="sceneLighting"></div>
  <img class="scene-item" id="item-rug" src="item-rug.png" style="display:none">
  <img class="scene-item" id="item-bed" src="item-bed.png" style="display:none">
  <img class="scene-item" id="item-lamp" src="item-lamp.png" style="display:none">
  <img class="scene-item" id="item-ball" src="item-ball.png" style="display:none">
  <img class="scene-item" id="item-rope" src="item-rope.png" style="display:none">
  <img class="scene-item" id="foodBowl" src="bowl-food-empty.png" alt="food bowl">
  <img class="scene-item" id="waterBowl" src="bowl-water-empty.png" alt="water bowl">
  <img class="scene-dog" id="dogImg" src="dog-idle.png" alt="pet dog">
</div>

<div class="hud-coins"><span class="dot">●</span><span id="coinCount">0</span> coins</div>

<div class="hud-status">
  <div class="row">
    <span id="foodStatus">🍖 Not fed</span>
    <span id="waterStatus">💧 Not watered</span>
  </div>
  <div class="msg" id="petMsg">Waiting for breakfast...</div>
</div>

<div class="fab-bar">
  <button class="fab-btn fab-icon" data-panel="tasks"></button>
  <button class="fab-btn fab-icon-shop" data-panel="shop"></button>
</div>

<div class="panel-overlay" id="panelOverlay"></div>

<div class="panel" id="panel-tasks">
  <div class="panel-header"><h2>Tasks</h2><button class="panel-close" data-close>✕</button></div>
  <h3>Priority — feeds & waters your pet</h3>
  <div id="priorityTasks"></div>

  <h3>Other habits — earn coins</h3>
  <div id="coinTasks"></div>

  <h3>Today's To-Dos</h3>
  <div id="todoList"></div>
  <div class="add-task-form">
    <input type="text" id="newTodoName" placeholder="Add a to-do">
    <button id="addTodoBtn">Add to-do</button>
  </div>

  <div class="manage-toggle" id="manageToggle">Manage tasks</div>
  <div class="manage" id="manageSection">
    <div id="manageList"></div>
    <div class="add-task-form">
      <strong>Add a coin task</strong>
      <input type="text" id="newTaskName" placeholder="Task name">
      <input type="number" id="newTaskCoins" placeholder="Coins earned">
      <button id="addTaskBtn">Add task</button>
    </div>
  </div>
</div>

<div class="panel" id="panel-shop">
  <div class="panel-header"><h2>Shop</h2><button class="panel-close" data-close>✕</button></div>
  <div id="shopItems"></div>
</div>

<script>
const STORAGE_KEY = 'cottageState';

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
}

const FEED_THRESHOLD = 25;   // grams of protein that counts as "a feeding"
const WATER_THRESHOLD = 13.3; // oz of water that counts as "a watering" (80oz goal / 6 waterings)
const FEED_DECAY_MS = 3.5 * 60 * 60 * 1000;      // hungry again after 3.5 hours (25g every 3.5h ≈ 100g/day)
const WATER_DECAY_MS = (14/6) * 60 * 60 * 1000;  // thirsty again after 2h20m (6 waterings across a 14-hr day)

function defaultState() {
  return {
    date: todayStr(),
    coins: 0,
    tasks: [
      { id: 'protein', name: 'Protein', role: 'food', type: 'progress', target: 100, unit: 'g', current: 0, done: false, steps: [10, 25] },
      { id: 'water', name: 'Water', role: 'water', type: 'progress', target: 80, unit: 'oz', current: 0, done: false, steps: [8, 16] },
      { id: 'supplements', name: 'Take supplements', role: 'coin', type: 'checkbox', coinValue: 5, done: false },
      { id: 'workout', name: 'Workout', role: 'coin', type: 'checkbox', coinValue: 10, done: false },
      { id: 'reading', name: 'Read 30 minutes', role: 'coin', type: 'checkbox', coinValue: 10, done: false }
    ],
    pet: {
      feedPending: 0,   // grams logged since the last feeding was triggered
      feedTime: null,   // timestamp of last feeding
      waterPending: 0,
      waterTime: null
    },
    owned: [],
    itemPositions: {}, // per-item {left, top} in % — where you've dragged each owned item to
    todos: [] // one-off tasks — not daily habits, don't reset, stay until checked off
  };
}

const SHOP_ITEMS = [
  { id: 'bed', name: 'Cozy pet bed', cost: 40, img: 'item-bed.png' },
  { id: 'rug', name: 'Woven rug', cost: 25, img: 'item-rug.png' },
  { id: 'lamp', name: 'Warm lamp', cost: 30, img: 'item-lamp.png' },
  { id: 'ball', name: 'Tennis ball', cost: 15, img: 'item-ball.png' },
  { id: 'rope', name: 'Rope toy', cost: 15, img: 'item-rope.png' }
];

function loadState() {
  let raw = localStorage.getItem(STORAGE_KEY);
  let state = raw ? JSON.parse(raw) : defaultState();
  if (!state.pet) {
    state.pet = { feedPending: 0, feedTime: null, waterPending: 0, waterTime: null };
  }
  if (!state.owned) state.owned = [];
  if (!state.itemPositions) state.itemPositions = {};
  if (!state.todos) state.todos = [];
  state.tasks.forEach(t => {
    if (t.streak === undefined) t.streak = 0;
    if (t.longestStreak === undefined) t.longestStreak = 0;
    if (t.missedCount === undefined) t.missedCount = 0;
    if (t.goalDays === undefined) t.goalDays = null;
  });

  if (state.date !== todayStr()) {
    const daysPassed = daysBetween(state.date, todayStr());
    state.tasks.forEach(t => {
      // the day that just ended: did the task get completed?
      if (t.done) {
        t.streak += 1;
        if (t.streak > t.longestStreak) t.longestStreak = t.streak;
      } else {
        t.streak = 0;
        t.missedCount += 1;
      }
      // any fully-skipped days in between (app wasn't opened at all) count as misses too
      const extraMissedDays = Math.max(0, daysPassed - 1);
      if (extraMissedDays > 0) {
        t.streak = 0;
        t.missedCount += extraMissedDays;
      }
      // reset for the new day
      t.done = false;
      if (t.type === 'progress') t.current = 0;
    });
    state.date = todayStr();
  }
  return state;
}

function daysBetween(dateStrA, dateStrB) {
  const [ay, am, ad] = dateStrA.split('-').map(Number);
  const [by, bm, bd] = dateStrB.split('-').map(Number);
  const a = new Date(ay, am - 1, ad);
  const b = new Date(by, bm - 1, bd);
  return Math.round((b - a) / 86400000);
}

function isFed() {
  return state.pet.feedTime && (Date.now() - state.pet.feedTime) < FEED_DECAY_MS;
}
function isWatered() {
  return state.pet.waterTime && (Date.now() - state.pet.waterTime) < WATER_DECAY_MS;
}
function timeLeft(sinceTime, decayMs) {
  const remainingMs = decayMs - (Date.now() - sinceTime);
  if (remainingMs <= 0) return null;
  const h = Math.floor(remainingMs / 3600000);
  const m = Math.floor((remainingMs % 3600000) / 60000);
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}

const TIRED_WARNING_MS = 60 * 60 * 1000; // pet looks tired starting 1 hour before the deadline

// 'content' = recently fed/watered, 'tired' = within 1hr of going hungry/thirsty, 'sad' = passed the deadline
function moodFor(sinceTime, decayMs) {
  if (!sinceTime) return 'sad';
  const elapsed = Date.now() - sinceTime;
  if (elapsed < decayMs - TIRED_WARNING_MS) return 'content';
  if (elapsed < decayMs) return 'tired';
  return 'sad';
}

function computeMood() {
  const foodMood = moodFor(state.pet.feedTime, FEED_DECAY_MS);
  const waterMood = moodFor(state.pet.waterTime, WATER_DECAY_MS);
  const rank = { content: 0, tired: 1, sad: 2 };
  const overall = rank[foodMood] >= rank[waterMood] ? foodMood : waterMood;
  return { foodMood, waterMood, overall };
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

let state = loadState();
saveState();

function render() {
  document.getElementById('coinCount').textContent = state.coins;

  const { foodMood, waterMood, overall } = computeMood();
  const fed = isFed();
  const watered = isWatered();
  const foodLeft = fed ? timeLeft(state.pet.feedTime, FEED_DECAY_MS) : null;
  const waterLeft = watered ? timeLeft(state.pet.waterTime, WATER_DECAY_MS) : null;

  const foodLabels = { content: `🍖 Fed (${foodLeft} left)`, tired: '🍖 Getting hungry soon', sad: '🍖 Hungry' };
  const waterLabels = { content: `💧 Watered (${waterLeft} left)`, tired: '💧 Getting thirsty soon', sad: '💧 Thirsty' };
  document.getElementById('foodStatus').textContent = foodLabels[foodMood];
  document.getElementById('foodStatus').className = foodMood === 'content' ? 'active' : '';
  document.getElementById('waterStatus').textContent = waterLabels[waterMood];
  document.getElementById('waterStatus').className = waterMood === 'content' ? 'active' : '';

  const petMsg = document.getElementById('petMsg');
  const moodMsg = {
    content: 'Buddy is happy, full, and hydrated!',
    tired:   'Buddy is looking a little tired — food or water coming up soon?',
    sad:     'Buddy looks sad and really needs food or water.'
  };
  petMsg.textContent = moodMsg[overall];
  renderScene(computeMood(), overall);

  renderShop();
  renderTodos();

  const priorityEl = document.getElementById('priorityTasks');
  const coinEl = document.getElementById('coinTasks');
  priorityEl.innerHTML = '';
  coinEl.innerHTML = '';

  state.tasks.forEach(task => {
    const card = document.createElement('div');
    card.className = 'task';

    if (task.type === 'checkbox') {
      card.innerHTML = `
        <div class="task-row">
          <div class="checkbox ${task.done ? 'done' : ''}" data-id="${task.id}">${task.done ? '✓' : ''}</div>
          <div class="task-name ${task.done ? 'done' : ''}">${task.name}</div>
          <div class="task-reward">+${task.coinValue}</div>
        </div>
        ${streakLine(task)}`;
      card.querySelector('.checkbox').addEventListener('click', () => toggleCheckbox(task.id));
    } else {
      const pct = Math.min(100, Math.round((task.current / task.target) * 100));
      const barColor = task.role === 'water' ? 'var(--water)' : 'var(--food)';
      card.innerHTML = `
        <div class="task-row">
          <div class="checkbox ${task.done ? 'done' : ''}">${task.done ? '✓' : ''}</div>
          <div class="task-name ${task.done ? 'done' : ''}">${task.name}</div>
        </div>
        <div class="progress-wrap">
          <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%; background:${barColor}"></div></div>
          <div class="progress-label"><span>${task.current}${task.unit}</span><span>${task.target}${task.unit} goal</span></div>
          <div class="quick-add">
            <button data-id="${task.id}" data-amt="${task.steps[0]}">+${task.steps[0]}${task.unit}</button>
            <button data-id="${task.id}" data-amt="${task.steps[1]}">+${task.steps[1]}${task.unit}</button>
            <span class="custom-add">
              <input type="number" placeholder="#" id="custom-${task.id}">
              <button data-custom="${task.id}">Add</button>
            </span>
          </div>
        </div>
        ${streakLine(task)}`;
      card.querySelectorAll('button[data-amt]').forEach(btn => {
        btn.addEventListener('click', () => addProgress(task.id, parseFloat(btn.dataset.amt)));
      });
      card.querySelector('button[data-custom]').addEventListener('click', () => {
        const input = document.getElementById('custom-' + task.id);
        const val = parseFloat(input.value);
        if (!isNaN(val) && val > 0) { addProgress(task.id, val); input.value = ''; }
      });
    }

    if (task.role === 'coin') coinEl.appendChild(card);
    else priorityEl.appendChild(card);
  });

  renderManage();
}

function streakLine(task) {
  let goalPart = '';
  if (task.goalDays) {
    const progress = Math.min(task.streak, task.goalDays);
    goalPart = ` · 🎯 ${progress}/${task.goalDays} days`;
  }
  return `<div class="task-stats">🔥 ${task.streak} day streak${goalPart} · missed ${task.missedCount}</div>`;
}

function renderTodos() {
  const list = document.getElementById('todoList');
  list.innerHTML = '';
  state.todos.forEach(todo => {
    const card = document.createElement('div');
    card.className = 'task';
    card.innerHTML = `
      <div class="task-row">
        <div class="checkbox" data-id="${todo.id}"></div>
        <div class="task-name">${todo.name}</div>
        <div class="task-reward">+1</div>
      </div>`;
    card.querySelector('.checkbox').addEventListener('click', () => completeTodo(todo.id));
    list.appendChild(card);
  });
}

function completeTodo(id) {
  const todo = state.todos.find(t => t.id === id);
  if (!todo) return;
  state.coins += 1;
  state.todos = state.todos.filter(t => t.id !== id);
  saveState();
  render();
}

function renderShop() {
  const shopEl = document.getElementById('shopItems');
  shopEl.innerHTML = '';
  SHOP_ITEMS.forEach(item => {
    const owned = state.owned.includes(item.id);
    const affordable = state.coins >= item.cost;
    const row = document.createElement('div');
    row.className = 'shop-item';
    row.innerHTML = `
      <img class="thumb" src="${item.img}" alt="${item.name}">
      <div class="info">
        <div class="name">${item.name}</div>
        <div class="cost">${owned ? 'Owned' : item.cost + ' coins'}</div>
      </div>
      <button ${owned || !affordable ? 'disabled' : ''} data-buy="${item.id}">${owned ? '✓' : 'Buy'}</button>`;
    shopEl.appendChild(row);
  });
  shopEl.querySelectorAll('button[data-buy]').forEach(btn => {
    btn.addEventListener('click', () => buyItem(btn.dataset.buy));
  });
}

function buyItem(id) {
  const item = SHOP_ITEMS.find(i => i.id === id);
  if (!item || state.owned.includes(id) || state.coins < item.cost) return;
  state.coins -= item.cost;
  state.owned.push(id);
  const defaultPos = ITEM_DEFAULT_POS[id];
  state.itemPositions[id] = { left: defaultPos.left, top: defaultPos.top };
  saveState();
  render();
}

// Where each dog pose sits within the scene (percentages of scene width/height).
// These are estimates based on how each pose is framed — nudge left/top/width if the dog looks off after you see it live.
const DOG_POSES = {
  idle:     { src: 'dog-idle.png',     left: 36, top: 56, width: 34 },
  eating:   { src: 'dog-eating.png',   left: 30, top: 60, width: 38 },
  drinking: { src: 'dog-drinking.png', left: 30, top: 60, width: 38 },
  tired:    { src: 'dog-tired.png',    left: 26, top: 66, width: 43 },
  sad:      { src: 'dog-sad.png',      left: 34, top: 58, width: 34 },
  sleeping: { src: 'dog-sleeping.png', left: 30, top: 70, width: 41 },
  excited:  { src: 'dog-excited.png',  left: 28, top: 60, width: 41 }
};
// Where the dog sleeps if you own the pet bed, instead of its default sleeping spot
const SLEEP_IN_BED = { left: 10, top: 66, width: 34 };
const HOME_SPOT = DOG_POSES.idle;

// Feeding station: where the bowls sit, and where the dog stands to use them.
// All estimates — easy to nudge once you see it live.
const FOOD_BOWL_SPOT  = { left: 30, top: 74, width: 20 };
const WATER_BOWL_SPOT = { left: 52, top: 74, width: 20 };
const EAT_STAND_SPOT   = { left: 34, top: 74, width: 36 };
const DRINK_STAND_SPOT = { left: 50, top: 74, width: 36 };
const WALK_MS = 1100;
const EAT_DRINK_HOLD_MS = 5000; // how long the dog stays at the bowl, clearly visible

// Where each shop item sits in the scene (percentages)
// Default spawn position for each item when first purchased (left/top/width in %).
// Once placed, your dragged position is saved and this default is no longer used.
const ITEM_DEFAULT_POS = {
  rug:  { left: 26, top: 78, width: 44 },
  bed:  { left: 4,  top: 70, width: 30 },
  lamp: { left: 76, top: 34, width: 20 },
  ball: { left: 60, top: 84, width: 10 },
  rope: { left: 70, top: 86, width: 14 }
};

// Which items can only go on the floor vs (later) on walls. All current items are floor-only.
const ITEM_ZONE = { rug: 'floor', bed: 'floor', lamp: 'floor', ball: 'floor', rope: 'floor' };

// Rough bounding box of the visible wood floor in room.png (percentages).
// An approximation, not a pixel-perfect trace of the floor's edges — tune if dragging feels
// like it allows placement too high on the walls or not low enough near the bottom.
const FLOOR_ZONE = { left: 3, top: 46, right: 97, bottom: 97 };

function clampToZone(zone, leftPct, topPct) {
  const bounds = zone === 'floor' ? FLOOR_ZONE : FLOOR_ZONE; // only floor zone exists for now
  return {
    left: Math.min(Math.max(leftPct, bounds.left), bounds.right),
    top: Math.min(Math.max(topPct, bounds.top), bounds.bottom)
  };
}

let transientPose = null;
let transientUntil = 0;
function triggerTransient(pose, ms) {
  transientPose = pose;
  transientUntil = Date.now() + ms;
  render();
  setTimeout(render, ms + 50);
}

// Walk-to-bowl-and-back sequence. Not saved to state — purely a visual sequence
// that plays out over a few seconds when you log enough food/water.
let animOverride = null;
let activeBowl = null; // 'food' | 'water' | null — which bowl is currently filled/in-use

function playFeedingSequence(kind) {
  const isFood = kind === 'food';
  const standSpot = isFood ? EAT_STAND_SPOT : DRINK_STAND_SPOT;
  const actionSrc = isFood ? DOG_POSES.eating.src : DOG_POSES.drinking.src;

  // walk to the bowl
  animOverride = { src: 'dog-walking.png', ...standSpot };
  render();

  setTimeout(() => {
    // arrived — eat/drink, bowl fills
    animOverride = { src: actionSrc, ...standSpot };
    activeBowl = kind;
    render();

    setTimeout(() => {
      // finished — bowl empties, walk back home
      activeBowl = null;
      animOverride = { src: 'dog-walking.png', ...HOME_SPOT };
      render();

      setTimeout(() => {
        animOverride = null; // back to normal mood-driven pose
        render();
      }, WALK_MS + 100);

    }, EAT_DRINK_HOLD_MS);
  }, WALK_MS + 100);
}

function currentHour() {
  return new Date().getHours();
}

function lightingFor(hour) {
  if (hour >= 6 && hour < 10)  return { color: '255,205,140', opacity: 0.18 };  // morning
  if (hour >= 10 && hour < 17) return { color: '255,255,255', opacity: 0 };     // day, neutral
  if (hour >= 17 && hour < 20) return { color: '255,140,60',  opacity: 0.28 };  // evening
  return { color: '20,30,80', opacity: 0.5 };                                   // night
}

function isNight(hour) {
  return hour >= 21 || hour < 6;
}

function renderScene(mood, overallMood) {
  // lighting
  const { color, opacity } = lightingFor(currentHour());
  const lightEl = document.getElementById('sceneLighting');
  lightEl.style.backgroundColor = `rgba(${color}, ${opacity})`;

  // items
  const itemEls = {
    rug: document.getElementById('item-rug'),
    bed: document.getElementById('item-bed'),
    lamp: document.getElementById('item-lamp'),
    ball: document.getElementById('item-ball'),
    rope: document.getElementById('item-rope')
  };
  Object.entries(itemEls).forEach(([id, el]) => {
    const owned = state.owned.includes(id);
    el.style.display = owned ? 'block' : 'none';
    el.classList.toggle('draggable', owned);
    if (owned && !el.classList.contains('dragging')) {
      const pos = state.itemPositions[id] || ITEM_DEFAULT_POS[id];
      const width = ITEM_DEFAULT_POS[id].width;
      el.style.left = pos.left + '%';
      el.style.top = pos.top + '%';
      el.style.width = width + '%';
    }
  });

  // feeding station bowls — always visible, fill/empty based on the feeding sequence
  const foodBowlEl = document.getElementById('foodBowl');
  const waterBowlEl = document.getElementById('waterBowl');
  foodBowlEl.src = activeBowl === 'food' ? 'bowl-food-full.png' : 'bowl-food-empty.png';
  waterBowlEl.src = activeBowl === 'water' ? 'bowl-water-full.png' : 'bowl-water-empty.png';
  foodBowlEl.style.display = 'block';
  waterBowlEl.style.display = 'block';
  foodBowlEl.style.left = FOOD_BOWL_SPOT.left + '%';
  foodBowlEl.style.top = FOOD_BOWL_SPOT.top + '%';
  foodBowlEl.style.width = FOOD_BOWL_SPOT.width + '%';
  waterBowlEl.style.left = WATER_BOWL_SPOT.left + '%';
  waterBowlEl.style.top = WATER_BOWL_SPOT.top + '%';
  waterBowlEl.style.width = WATER_BOWL_SPOT.width + '%';

  // dog pose + position
  const dogImg = document.getElementById('dogImg');
  let src, left, top, width;

  if (animOverride) {
    ({ src, left, top, width } = animOverride);
  } else if (transientPose && Date.now() < transientUntil) {
    ({ src, left, top, width } = DOG_POSES[transientPose]);
  } else {
    let poseName;
    if (overallMood === 'sad') poseName = 'sad';
    else if (overallMood === 'tired') poseName = 'tired';
    else if (isNight(currentHour())) poseName = 'sleeping';
    else poseName = 'idle';

    const pose = DOG_POSES[poseName];
    ({ src, left, top, width } = pose);
    if (poseName === 'sleeping' && state.owned.includes('bed')) {
      ({ left, top, width } = SLEEP_IN_BED);
    }
  }

  dogImg.src = src;
  dogImg.style.left = left + '%';
  dogImg.style.top = top + '%';
  dogImg.style.width = width + '%';
}

function toggleCheckbox(id) {
  const task = state.tasks.find(t => t.id === id);
  if (!task) return;
  task.done = !task.done;
  state.coins += task.done ? task.coinValue : -task.coinValue;
  saveState();
  if (task.done) triggerTransient('excited', 3000);
  render();
}

function addProgress(id, amt) {
  const task = state.tasks.find(t => t.id === id);
  if (!task) return;
  task.current = Math.max(0, task.current + amt);
  task.done = task.current >= task.target;

  let justFed = false, justWatered = false;
  if (task.role === 'food') {
    state.pet.feedPending += amt;
    while (state.pet.feedPending >= FEED_THRESHOLD) {
      state.pet.feedPending -= FEED_THRESHOLD;
      state.pet.feedTime = Date.now();
      justFed = true;
    }
  } else if (task.role === 'water') {
    state.pet.waterPending += amt;
    while (state.pet.waterPending >= WATER_THRESHOLD) {
      state.pet.waterPending -= WATER_THRESHOLD;
      state.pet.waterTime = Date.now();
      justWatered = true;
    }
  }

  saveState();
  if (justFed) playFeedingSequence('food');
  else if (justWatered) playFeedingSequence('water');
  render();
}

function renderManage() {
  const list = document.getElementById('manageList');
  list.innerHTML = '';
  state.tasks.forEach(task => {
    const row = document.createElement('div');
    row.className = 'manage-item';
    if (task.type === 'checkbox') {
      row.innerHTML = `
        <input type="text" value="${task.name}" data-field="name" data-id="${task.id}">
        <input type="number" value="${task.coinValue}" data-field="coinValue" data-id="${task.id}">
        <input type="number" value="${task.goalDays ?? ''}" placeholder="goal days" data-field="goalDays" data-id="${task.id}">
        <button class="del" data-del="${task.id}">✕</button>`;
    } else {
      row.innerHTML = `
        <input type="text" value="${task.name}" data-field="name" data-id="${task.id}">
        <input type="number" value="${task.target}" data-field="target" data-id="${task.id}">
        <span>${task.unit}</span>
        <input type="number" value="${task.goalDays ?? ''}" placeholder="goal days" data-field="goalDays" data-id="${task.id}">`;
    }
    list.appendChild(row);
  });

  list.querySelectorAll('input[data-field]').forEach(inp => {
    inp.addEventListener('change', () => {
      const task = state.tasks.find(t => t.id === inp.dataset.id);
      const field = inp.dataset.field;
      if (field === 'name') {
        task.name = inp.value;
      } else if (field === 'goalDays') {
        task.goalDays = inp.value === '' ? null : parseFloat(inp.value);
      } else {
        task[field] = parseFloat(inp.value);
      }
      saveState();
      render();
    });
  });
  list.querySelectorAll('button[data-del]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.tasks = state.tasks.filter(t => t.id !== btn.dataset.del);
      saveState();
      render();
    });
  });
}

document.getElementById('manageToggle').addEventListener('click', () => {
  document.getElementById('manageSection').classList.toggle('open');
});

document.getElementById('addTaskBtn').addEventListener('click', () => {
  const name = document.getElementById('newTaskName').value.trim();
  const coins = parseFloat(document.getElementById('newTaskCoins').value);
  if (!name || isNaN(coins)) return;
  state.tasks.push({
    id: 'task-' + Date.now(),
    name, role: 'coin', type: 'checkbox', coinValue: coins, done: false,
    streak: 0, longestStreak: 0, missedCount: 0, goalDays: null
  });
  document.getElementById('newTaskName').value = '';
  document.getElementById('newTaskCoins').value = '';
  saveState();
  render();
});

document.getElementById('addTodoBtn').addEventListener('click', () => {
  const name = document.getElementById('newTodoName').value.trim();
  if (!name) return;
  state.todos.push({ id: 'todo-' + Date.now(), name, coinValue: 1 });
  document.getElementById('newTodoName').value = '';
  saveState();
  render();
});

render();
setInterval(render, 60000); // keep the "time left" countdown current while the app is open

const panelOverlay = document.getElementById('panelOverlay');
function openPanel(name) {
  document.getElementById('panel-' + name).classList.add('open');
  panelOverlay.classList.add('open');
}
function closeAllPanels() {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('open'));
  panelOverlay.classList.remove('open');
}
document.querySelectorAll('.fab-btn').forEach(btn => {
  btn.addEventListener('click', () => openPanel(btn.dataset.panel));
});
document.querySelectorAll('.panel-close').forEach(btn => {
  btn.addEventListener('click', closeAllPanels);
});
panelOverlay.addEventListener('click', closeAllPanels);

// Drag-and-drop placement for owned items
function makeDraggable(el, itemId) {
  let dragging = false;
  let startX, startY, startLeftPct, startTopPct, sceneRect;

  function pointerDown(e) {
    if (!el.classList.contains('draggable')) return;
    e.preventDefault();
    const point = e.touches ? e.touches[0] : e;
    dragging = true;
    sceneRect = document.getElementById('scene').getBoundingClientRect();
    startX = point.clientX;
    startY = point.clientY;
    const pos = state.itemPositions[itemId] || ITEM_DEFAULT_POS[itemId];
    startLeftPct = pos.left;
    startTopPct = pos.top;
    el.classList.add('dragging');
    document.addEventListener('touchmove', pointerMove, { passive: false });
    document.addEventListener('touchend', pointerUp);
    document.addEventListener('mousemove', pointerMove);
    document.addEventListener('mouseup', pointerUp);
  }

  function pointerMove(e) {
    if (!dragging) return;
    e.preventDefault();
    const point = e.touches ? e.touches[0] : e;
    const dxPct = ((point.clientX - startX) / sceneRect.width) * 100;
    const dyPct = ((point.clientY - startY) / sceneRect.height) * 100;
    const zone = ITEM_ZONE[itemId] || 'floor';
    const { left, top } = clampToZone(zone, startLeftPct + dxPct, startTopPct + dyPct);
    el.style.left = left + '%';
    el.style.top = top + '%';
  }

  function pointerUp() {
    if (!dragging) return;
    dragging = false;
    el.classList.remove('dragging');
    state.itemPositions[itemId] = {
      left: parseFloat(el.style.left),
      top: parseFloat(el.style.top)
    };
    saveState();
    document.removeEventListener('touchmove', pointerMove);
    document.removeEventListener('touchend', pointerUp);
    document.removeEventListener('mousemove', pointerMove);
    document.removeEventListener('mouseup', pointerUp);
  }

  el.addEventListener('touchstart', pointerDown, { passive: false });
  el.addEventListener('mousedown', pointerDown);
}

['rug', 'bed', 'lamp', 'ball', 'rope'].forEach(id => {
  const el = document.getElementById('item-' + id);
  if (el) makeDraggable(el, id);
});
</script>
